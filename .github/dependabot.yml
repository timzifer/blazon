version: 2

updates:
  # The module has no dependencies, and a test enforces that. This entry is
  # here so that the day one is added deliberately, it is also watched.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
