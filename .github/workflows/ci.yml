name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Three operating systems is not belt and braces here. The float-heavy
    # renderers are only allowed to be reproducible within a perceptual-hash
    # tolerance, because math.Sin and math.Pow may differ by an ulp between
    # architectures. Running the suite on three of them turns that from an
    # assumption into a measurement.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  distinctness:
    # The gate. If a change makes patch bumps harder to tell apart, this job is
    # what says so — the invariant as a build rule rather than as a claim in
    # the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: distinctness thresholds
        run: go test -run TestDistinctness -v .

      - name: distance histograms
        shell: bash
        run: |
          {
            echo '## Perceptual distance by renderer'
            echo
            echo 'How much headroom the frozen thresholds still have.'
            echo
            echo '```'
            go run ./cmd/blazon dist -all
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
