name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Two axes, both load-bearing.
    #
    # Three operating systems, because the float-heavy renderers are only
    # allowed to be reproducible within a perceptual-hash tolerance: math.Sin
    # and math.Pow may differ by an ulp between architectures, and running the
    # suite on three of them turns that from an assumption into a measurement.
    #
    # Two Go versions, because go.mod declares a floor and a floor nobody
    # builds against is a guess. The "floor" leg is what makes it a fact.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: the floor in the matrix matches the one in go.mod
        if: matrix.go != 'stable'
        shell: bash
        run: |
          declared=$(awk '/^go /{print $2}' go.mod)
          if [ "$declared" != "${{ matrix.go }}" ]; then
            echo "go.mod declares go $declared but the matrix builds ${{ matrix.go }}."
            echo "Update both, or the floor is not actually being tested."
            exit 1
          fi

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  distinctness:
    # The gate. If a change makes patch bumps harder to tell apart, this job is
    # what says so — the invariant as a build rule rather than as a claim in
    # the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: distinctness thresholds
        run: go test -run TestDistinctness -v .

      - name: distance histograms
        shell: bash
        run: |
          {
            echo '## Perceptual distance by renderer'
            echo
            echo 'How much headroom the frozen thresholds still have.'
            echo
            echo '```'
            go run ./cmd/blazon dist -all
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
