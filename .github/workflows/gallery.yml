name: gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # The gallery is committed, and the committed images are the visual
    # regression baseline: if a change alters what a renderer draws, the image
    # diff in the pull request is the review.
    #
    # This job verifies rather than commits. An earlier version pushed the
    # regenerated gallery back to main, which cannot work once main is
    # protected — the token this job runs with is not an administrator, so its
    # push would simply be rejected. Making staleness a build failure instead
    # keeps the guarantee and removes the bot from the write path entirely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: regenerate
        run: go run ./cmd/blazon gallery -o docs/gallery -readme README.md

      - name: the committed gallery must match
        shell: bash
        run: |
          if git diff --quiet; then
            echo "gallery is up to date"
            exit 0
          fi
          echo "The committed gallery does not match what the code renders."
          echo "Run this and commit the result:"
          echo
          echo "  go run ./cmd/blazon gallery -o docs/gallery -readme README.md"
          echo
          git diff --stat
          exit 1

      - name: regenerating twice must be a no-op
        shell: bash
        run: |
          # A non-idempotent generator would make this job fail on every push
          # even when nothing changed.
          go run ./cmd/blazon gallery -o docs/gallery -readme README.md
          if ! git diff --quiet; then
            echo "The gallery generator is not idempotent: a second run changed files."
            git diff --stat
            exit 1
          fi
