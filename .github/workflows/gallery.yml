name: gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Regenerating the gallery on every push makes the committed images a
      # visual regression test: a refactor that changes what a renderer draws
      # shows up as an image diff in this job's commit instead of going
      # unnoticed.
      - name: render the gallery
        run: go run ./cmd/blazon gallery -o docs/gallery -readme README.md

      - name: commit if anything changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "gallery unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gallery README.md
          git commit -m "docs: regenerate gallery [skip ci]"
          git push
